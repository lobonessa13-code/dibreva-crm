<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DIBREVA - Tarefas</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css?v=12">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>

  <button class="mobile-toggle" aria-label="Menu">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <div class="mobile-overlay"></div>

  <aside class="sidebar" id="sidebar"></aside>

  <main class="main-content">

    <div class="page-header">
      <h1>Tarefas</h1>
      <div class="page-header-actions">
        <button class="btn btn-primary" onclick="TAREFAS.openNew()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Nova Tarefa
        </button>
      </div>
    </div>

    <!-- KPIs -->
    <div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-label">A Fazer</div><div class="kpi-value" id="kpi-a-fazer">—</div></div>
      <div class="kpi-card"><div class="kpi-label">Em Andamento</div><div class="kpi-value warning" id="kpi-andamento">—</div></div>
      <div class="kpi-card"><div class="kpi-label">Aguardando Decisão</div><div class="kpi-value" id="kpi-decisao" style="color: #7F5AB4;">—</div></div>
      <div class="kpi-card"><div class="kpi-label">Atrasadas</div><div class="kpi-value danger" id="kpi-atrasadas">—</div></div>
      <div class="kpi-card"><div class="kpi-label">Concluídas no Mês</div><div class="kpi-value success" id="kpi-concluidas-mes">—</div></div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="board" onclick="TAREFAS.switchTab('board')">Board</button>
      <button class="tab-btn" data-tab="lista" onclick="TAREFAS.switchTab('lista')">Lista</button>
    </div>

    <!-- Tab: Board -->
    <div class="tab-content active" id="tab-board">
      <div class="pipeline pipeline-4col" id="board-container"></div>
    </div>

    <!-- Tab: Lista -->
    <div class="tab-content" id="tab-lista">
      <div class="table-card">
        <div class="table-toolbar">
          <input type="text" class="search-input" id="search-tarefas" placeholder="Buscar tarefa..." oninput="TAREFAS.renderTable(1)">
          <select class="form-control" id="filtro-status" onchange="TAREFAS.renderTable(1)" style="max-width: 180px;">
            <option value="todos">Status: Todos</option>
            <option value="a_fazer">A Fazer</option>
            <option value="em_andamento">Em Andamento</option>
            <option value="aguardando_decisao">Aguardando Decisão</option>
            <option value="concluida">Concluída</option>
          </select>
          <select class="form-control" id="filtro-responsavel" onchange="TAREFAS.renderTable(1)" style="max-width: 160px;">
            <option value="todos">Responsável: Todos</option>
          </select>
          <select class="form-control" id="filtro-urgencia" onchange="TAREFAS.renderTable(1)" style="max-width: 160px;">
            <option value="todos">Urgência: Todas</option>
            <option value="urgente">Urgente</option>
            <option value="alta">Alta</option>
            <option value="media">Média</option>
            <option value="baixa">Baixa</option>
          </select>
        </div>
        <table>
          <thead>
            <tr>
              <th>Título</th>
              <th>Responsável</th>
              <th>Urgência</th>
              <th>Status</th>
              <th>Início</th>
              <th>Entrega</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tarefas-table-body"></tbody>
        </table>
        <div class="table-pagination" id="tarefas-pagination"></div>
      </div>
    </div>

  </main>

  <!-- Modal: Nova/Editar Tarefa -->
  <div class="modal-overlay" id="modal-tarefa">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-tarefa-title">Nova Tarefa</h2>
        <button class="modal-close" onclick="UI.closeModal('modal-tarefa')">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="tarefa-id">

        <div class="form-group">
          <label>Título <span class="required">*</span></label>
          <input type="text" class="form-control" id="tarefa-titulo" required placeholder="O que precisa ser feito?">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Tipo</label>
            <select class="form-control" id="tarefa-tipo">
              <option value="tarefa">Tarefa</option>
              <option value="decisao">Decisão (precisa de alinhamento)</option>
            </select>
          </div>
          <div class="form-group">
            <label>Responsável</label>
            <select class="form-control" id="tarefa-responsavel"></select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Status</label>
            <select class="form-control" id="tarefa-status">
              <option value="a_fazer">A Fazer</option>
              <option value="em_andamento">Em Andamento</option>
              <option value="aguardando_decisao">Aguardando Decisão</option>
              <option value="concluida">Concluída</option>
            </select>
          </div>
          <div class="form-group">
            <label>Urgência</label>
            <select class="form-control" id="tarefa-urgencia">
              <option value="baixa">Baixa</option>
              <option value="media">Média</option>
              <option value="alta">Alta</option>
              <option value="urgente">Urgente</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Data de Início</label>
            <input type="date" class="form-control" id="tarefa-data-inicio">
          </div>
          <div class="form-group">
            <label>Data de Entrega</label>
            <input type="date" class="form-control" id="tarefa-data-entrega">
          </div>
        </div>

        <div class="form-group">
          <label>Descrição</label>
          <textarea class="form-control" id="tarefa-descricao" rows="4" placeholder="Detalhes, contexto, links..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="UI.closeModal('modal-tarefa')">Cancelar</button>
        <button class="btn btn-primary" onclick="TAREFAS.save()">Salvar</button>
      </div>
    </div>
  </div>

  <!-- Modal: Detalhe da Tarefa + Comentários -->
  <div class="modal-overlay" id="modal-tarefa-detalhe">
    <div class="modal">
      <div class="modal-header">
        <h2 id="detalhe-titulo">Tarefa</h2>
        <button class="modal-close" onclick="UI.closeModal('modal-tarefa-detalhe')">&times;</button>
      </div>
      <div class="modal-body">
        <div class="tarefa-card-badges" id="detalhe-badges" style="margin-bottom: 14px;"></div>
        <div class="tarefa-detalhe-grid" id="detalhe-grid"></div>

        <div class="form-group">
          <label>Descrição</label>
          <div id="detalhe-descricao" style="font-size: 13px; color: var(--azul-light); white-space: pre-wrap;"></div>
        </div>

        <div class="form-group">
          <label>Comentários e Decisões</label>
          <div class="comentarios-lista" id="detalhe-comentarios"></div>
          <div class="comentario-form">
            <input type="text" class="form-control" id="novo-comentario" placeholder="Escreva um comentário ou registre uma decisão..." onkeydown="if(event.key==='Enter') TAREFAS.addComentario()">
            <button class="btn btn-primary" onclick="TAREFAS.addComentario()">Enviar</button>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="TAREFAS.remove(TAREFAS.currentDetailId)">Excluir</button>
        <button class="btn btn-primary" onclick="TAREFAS.openEdit(TAREFAS.currentDetailId)">Editar</button>
      </div>
    </div>
  </div>

  <script src="js/supabase-config.js?v=12"></script>
  <script src="js/auth.js?v=12"></script>
  <script src="js/db.js?v=12"></script>
  <script src="js/ui.js?v=12"></script>
  <script src="js/nav.js?v=12"></script>
  <script src="js/tarefas.js?v=12"></script>
  <script>
    try {
      document.getElementById('sidebar').innerHTML = renderSidebar('tarefas');
    } catch (e) { console.error('Erro ao renderizar sidebar:', e); }

    // Preenche selects de responsável a partir da lista configurável
    const selResp = document.getElementById('tarefa-responsavel');
    const selFiltroResp = document.getElementById('filtro-responsavel');
    RESPONSAVEIS.forEach(r => {
      selResp.insertAdjacentHTML('beforeend', `<option value="${r}">${r}</option>`);
      selFiltroResp.insertAdjacentHTML('beforeend', `<option value="${r}">${r}</option>`);
    });

    Auth.guard().then(ok => {
      if (!ok) return;
      TAREFAS.init();
    }).catch(e => console.error('Erro em Auth.guard:', e));
  </script>
</body>
</html>
